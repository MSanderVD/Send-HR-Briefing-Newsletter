name: KI-Briefing

on:
  schedule:
    - cron: "0 6 * * 3"   # jeden Mittwoch 06:00 UTC

  workflow_dispatch: {}

jobs:
  ki-briefing:
    name: Wochenbriefing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: KI-Briefing ausführen
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON:       ${{ secrets.GMAIL_TOKEN_JSON }}
          REPORT_RECIPIENT_EMAIL: ${{ secrets.REPORT_RECIPIENT_EMAIL }}
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
        run: python ki_briefing.py --mode weekly

      - name: Report als Artifact hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ki-briefing-report
          path: output/*.html
          if-no-files-found: warn
