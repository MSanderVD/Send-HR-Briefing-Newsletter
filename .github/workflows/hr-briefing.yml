name: HR-Briefing

on:
  schedule:
    - cron: "0 6 * * 1"   # jeden Montag 06:00 UTC

  workflow_dispatch:
    inputs:
      mode:
        description: "weekly = vollständiger Lauf mit Versand · test = eine Kategorie, kein Versand"
        type: choice
        required: true
        default: weekly
        options: [weekly, test]
      test_kategorie:
        description: "Nur bei mode=test: welche Kategorie geprüft wird"
        type: choice
        required: false
        default: Urteile
        options:
          - Gesetzesvorhaben
          - BMF-Schreiben
          - Urteile
          - Verordnungen
          - Gesetzgebungsverfahren
          - HR-Digitalisierung

# Der Lauf schreibt state/hot_topics.json zurück ins Repo - das ist das
# Gedächtnis des Themenradars. Ohne Schreibrecht ginge der Verlauf nach
# jedem Lauf verloren und jedes Dauerthema wäre wieder neu.
permissions:
  contents: write

jobs:
  hr-briefing:
    name: Wochenbriefing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: HR-Briefing ausführen
        env:
          REPORT_RECIPIENT_EMAIL: ${{ secrets.REPORT_RECIPIENT_EMAIL }}
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON:       ${{ secrets.GMAIL_TOKEN_JSON }}
          ONEDRIVE_TENANT_ID:     ${{ secrets.ONEDRIVE_TENANT_ID }}
          ONEDRIVE_CLIENT_ID:     ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          ONEDRIVE_USER_EMAIL:    ${{ secrets.ONEDRIVE_USER_EMAIL }}
          ONEDRIVE_FOLDER_PATH:   ${{ secrets.ONEDRIVE_FOLDER_PATH }}
          FIRECRAWL_API_KEY:      ${{ secrets.FIRECRAWL_API_KEY }}
          TEST_KATEGORIE:         ${{ inputs.test_kategorie }}
        # Der Zeitplan liefert keine inputs - dann gilt der volle Lauf.
        run: python hr_briefing.py --mode ${{ inputs.mode || 'weekly' }}

      # Auch bei einem fehlgeschlagenen Lauf zurückschreiben: die Quellen
      # wurden ja abgerufen, und die dort gefundenen Stichtage sollen für
      # die nächste Woche nicht verloren gehen (hr_briefing.py sichert
      # den Zustand deshalb auch im Fehlerfall).
      - name: Themenradar zurückschreiben
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Themenradar nach Lauf vom $(date -u +%Y-%m-%d) fortgeschrieben"
            # Zwischen Checkout und Push kann ein anderer Commit gelandet
            # sein; rebase statt harter Push-Fehlschlag.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Themenradar unverändert - kein Commit nötig."
          fi

      - name: Report als Artifact hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hr-briefing-report
          path: output/*.html
          if-no-files-found: warn
